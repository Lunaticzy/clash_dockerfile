port: 7890
mode: rule
log-level: warning
proxies:
  - name: "test-node-1"
    type: ss
    server: 127.0.0.1
    port: 8388
    cipher: aes-256-gcm
    password: "test-password"
  - name: "test-node-2"
    type: ss
    server: 127.0.0.1
    port: 8388
    cipher: aes-256-gcm
    password: "test-password"
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - test-node-1
      - test-node-2
rules:
  - MATCH,PROXY
